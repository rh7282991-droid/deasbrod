      return (
        <svg
          xmlns="http://www.w3.org/2000/svg"

    };

    // ============================================================================
    // PHONE FORMATTER FOR BANGLADESH (+0 AND WASENDER 880 FORMAT)
    // ============================================================================
    const formatBdPhoneNumbers = (rawPhone) => {
      if (rawPhone === null || rawPhone === undefined) {
        return { localWithZero: '', wasenderFormat: '', isValid: false };
      }
      let str = String(rawPhone).trim();
      if (str.endsWith('.0')) str = str.slice(0, -2);
      let digits = str.replace(/\D/g, '');
      if (!digits) {
        return { localWithZero: '', wasenderFormat: '', isValid: false };
      }
      if (digits.length === 10 && digits.startsWith('1')) {
        digits = '0' + digits;
      } else if (digits.length === 13 && digits.startsWith('8801')) {
        digits = '0' + digits.slice(3);
      } else if (!digits.startsWith('0') && digits.startsWith('1') && digits.length >= 9) {
        digits = '0' + digits;
      }

      const localWithZero = digits;
      const wasenderFormat = digits.startsWith('0')
        ? '88' + digits
        : digits.startsWith('880')
        ? digits
        : '880' + digits;

      const isValid = /^01[3-9]\d{8}$/.test(localWithZero);
      return { localWithZero, wasenderFormat, isValid };
    };

    // Safe Clipboard helper for iframe environments
    const copyToClipboardSafe = (text) => {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        return true;
      } catch (err) {
        return false;
      }
    };

    const ensureArray = (val) => {
      if (!val) return [];
      if (Array.isArray(val)) return val.map(v => String(v).trim()).filter(Boolean);
      if (typeof val === 'string') {
        const trimmed = val.trim();
        if (!trimmed) return [];
        if (trimmed.startsWith('[')) {
          try {
            const parsed = JSON.parse(trimmed);
            if (Array.isArray(parsed)) return parsed.map(v => String(v).trim()).filter(Boolean);
          } catch (e) {}
        }
        return trimmed.split(/[,;\n|/]+/).map(s => s.trim()).filter(Boolean);
      }
      return [];
    };

    const sanitizeNumber = (val, fallback = 0) => {
      if (typeof val === 'number' && !isNaN(val)) return val;
      if (!val) return fallback;
      const str = String(val).replace(/,/g, '');
      const match = str.match(/\d+/);
      return match ? parseInt(match[0], 10) : fallback;
    };

    // Smart Salary Range Parser: handles "3-5,000", "4-7,000", "6-10,000", "5000", etc.
    const parseSalaryRangeBounds = (rawRange, rawExpected = 0) => {
      const str = String(rawRange || '').trim();
      if (!str || str.toLowerCase() === 'not provided' || str.toLowerCase() === 'nan' || str.toLowerCase() === 'negotiable') {
        const exp = Number(rawExpected) || 0;
        if (exp >= 500 && exp !== 7500 && exp !== 36687) {
          return { min: exp, max: exp, hasSalary: true };
        }
        return { min: 0, max: 0, hasSalary: false };
      }

      const cleaned = str.replace(/,/g, '');
      const parts = cleaned.match(/\d+/g);
      if (!parts || parts.length === 0) {
        return { min: 0, max: 0, hasSalary: false };
      }

      let nums = parts.map((n) => parseInt(n, 10)).filter((n) => !isNaN(n));
      if (nums.length >= 2) {
        let first = nums[0];
        let second = nums[1];
        // If written like "3-5,000" -> first is 3, second is 5000 -> convert 3 to 3000
        if (first < 100 && second >= 1000) {
          first = first * 1000;
        }
        // If written like "3-5k" -> both < 100
        if (first < 100 && second < 100 && /k|হাজার/i.test(cleaned)) {
          first *= 1000;
          second *= 1000;
        }
        return {
          min: Math.min(first, second),
          max: Math.max(first, second),
          hasSalary: true
        };
      }

      let single = nums[0];
      if (single < 100 && /k|হাজার/i.test(cleaned)) {
        single *= 1000;
      } else if (single > 0 && single < 50) {
        single *= 1000;
      }
      return { min: single, max: single, hasSalary: single >= 500 };
    };

    // Smart Class Range Overlap Helper (e.g., matches "Class 6-8" with tutor having "5-10" or "1-10")
    const parseClassNumbers = (text) => {
      const s = String(text || '').toLowerCase();
      const grades = new Set();

      if (s.includes('hsc') || s.includes('11') || s.includes('12') || s.includes('inter') || s.includes('college')) {
        grades.add(11);
        grades.add(12);
      }
      if (s.includes('ssc') || s.includes('9') || s.includes('10')) {
        grades.add(9);
        grades.add(10);
      }
      if (s.includes('o level') || s.includes('a level') || s.includes('o/a')) {
        grades.add(9);
        grades.add(10);
        grades.add(11);
        grades.add(12);
      }
      if (s.includes('admission')) {
        grades.add(13);
      }

      // Extract ranges like 1-10, 5-10, 1-5, 6-8
      const rangeRegex = /\b(\d{1,2})\s*[-–to]+\s*(\d{1,2})\b/g;
      let match;
      while ((match = rangeRegex.exec(s)) !== null) {
        const start = parseInt(match[1], 10);
        const end = parseInt(match[2], 10);
        if (start >= 1 && end <= 12 && start <= end) {
          for (let g = start; g <= end; g++) grades.add(g);
        }
      }

      // Extract standalone class numbers 1..12
      const singleNums = s.match(/\b(\d{1,2})\b/g);
      if (singleNums) {
        singleNums.forEach((n) => {
          const val = parseInt(n, 10);
          if (val >= 1 && val <= 12) grades.add(val);
        });
      }

      return grades;
    };

    // Clean Broken Mixed Bangla-English Names & Generate Clean Avatar URL
    const cleanTutorName = (rawName) => {
      if (!rawName) return 'Unnamed Tutor';
      let s = String(rawName).trim();
      s = s.replace(/Tanjিনা/gi, 'তানজিনা');
      s = s.replace(/Tanjina\s+আক্তার/gi, 'তানজিনা আক্তার');
      s = s.replace(/^[\u09BE-\u09CC\u09D7]+/, '');
      return s.trim() || 'Unnamed Tutor';
    };

    // Remove all numbers (English & Bangla digits) and house/flat/road number fragments from addresses
    const cleanAddressText = (raw) => {
      if (!raw) return '';
      let s = String(raw).trim();
      if (!s || s.toLowerCase() === 'nan' || s.toLowerCase() === 'not specified') return '';
      // Remove Flat/House/Holding/Plot numbers like "Flat no:602", "House 12", etc.
      s = s.replace(/\b(?:flat|house|holding|plot|apt|room|floor)\s*(?:no\.?|#|:|-)?\s*[0-9\u09E6-\u09EF]+[a-zA-Z]?\b/gi, ' ');
      // Remove slash-separated house numbers like "2/4/b", "88/89", "79/c"
      s = s.replace(/\b[0-9\u09E6-\u09EF]+\s*(?:\/\s*[0-9\u09E6-\u09EFa-zA-Z]+)+\b/g, ' ');
      // Remove ordinal or "no" numbers like "1 no", "2nd", "৫ নং"
      s = s.replace(/\b[0-9\u09E6-\u09EF]+\s*(?:no\.?|নং|st|nd|rd|th)\b/gi, ' ');
      // Remove digit+letter combos like "4b", "12A"
      s = s.replace(/\b[0-9\u09E6-\u09EF]+[a-zA-Z]\b/g, ' ');
      // Remove any remaining English (0-9) and Bangla (০-৯) digits
      s = s.replace(/[0-9\u09E6-\u09EF]+/g, ' ');
      // Clean up leftover slashes, hashes, colons, and extra commas/spaces
      s = s.replace(/[\/#:]+/g, ' ');
      s = s.replace(/\s*,\s*/g, ', ');
      s = s.replace(/(,\s*){2,}/g, ', ');
      s = s.replace(/^[\s,.\-–]+|[\s,.\-–]+$/g, '');
      s = s.replace(/\s{2,}/g, ' ').trim();
      return s;
    };

    const cleanAreasList = (raw) => {
      const arr = ensureArray(raw);
      const cleaned = arr
        .map((a) => cleanAddressText(a))
        .filter(
          (a) =>
            a &&
            a.length >= 2 &&
            a.toLowerCase() !== 'nan' &&
            a.toLowerCase() !== 'not specified'
        );
      return Array.from(new Set(cleaned));
    };

    const getCleanAvatarUrl = (name) => {
      const cleaned = cleanTutorName(name);
      const words = cleaned.split(/\s+/).filter(Boolean);
      let initials = 'TU';
      const asciiLetters = cleaned.match(/[A-Za-z]+/g);
      if (asciiLetters && asciiLetters.join('').length >= 2 && !/[\u0980-\u09FF]/.test(cleaned)) {
        if (asciiLetters.length >= 2) {
          initials = (asciiLetters[0][0] + asciiLetters[1][0]).toUpperCase();
        } else {
          initials = asciiLetters[0].slice(0, 2).toUpperCase();
        }
      } else {
        const banglaChars = words
          .map((w) => {
            const m = w.match(/[\u0985-\u09B9A-Za-z]/);
            return m ? m[0] : '';
          })
          .filter(Boolean);
        initials = banglaChars.slice(0, 2).join('') || 'T';
      }

      // Dynamic Color Palette based on Tutor Name
      const colorPalette = [
        { bg: 'a7f3d0', text: '065f46' }, // Mint Emerald
        { bg: 'ddd6fe', text: '4c1d95' }, // Soft Violet
        { bg: 'fecdd3', text: '881337' }, // Rose Coral
        { bg: 'bae6fd', text: '0c4a6e' }, // Sky Blue
        { bg: 'fde68a', text: '78350f' }, // Warm Amber
        { bg: 'fbcfe8', text: '831843' }, // Pastel Pink
        { bg: 'c7d2fe', text: '1e1b4b' }, // Indigo Mist
        { bg: '99f6e4', text: '134e4a' }, // Teal Aqua
        { bg: 'fed7aa', text: '7c2d12' }, // Peach Orange
        { bg: 'd9f99d', text: '365314' }, // Lime Leaf
        { bg: 'e9d5ff', text: '581c87' }, // Purple Lavender
        { bg: 'bfdbfe', text: '1e3a8a' }  // Royal Soft Blue
      ];

      let hash = 0;
      for (let i = 0; i < cleaned.length; i++) {
        hash = cleaned.charCodeAt(i) + ((hash << 5) - hash);
      }
      const palette = colorPalette[Math.abs(hash) % colorPalette.length];

      return `https://ui-avatars.com/api/?name=${encodeURIComponent(initials)}&background=${palette.bg}&color=${palette.text}&size=200&bold=true&length=2`;
    };

    // Fix Excel date conversion & Filter out invalid numbers like 37115 in Class Level
    const normalizeClassString = (raw) => {
      if (!raw) return [];
      const items = Array.isArray(raw) ? raw : String(raw).split(/[,;\n|]+/);
      const monthMap = {
        jan: '1', feb: '2', mar: '3', apr: '4', may: '5', jun: '6',
        jul: '7', aug: '8', sep: '9', oct: '10', nov: '11', dec: '12'
      };

      const validClasses = [];
      for (let item of items) {
        let s = String(item || '').trim();
        if (!s || s.toLowerCase() === 'nan' || s.toLowerCase() === 'not provided' || s.toLowerCase() === 'not specified' || s.toLowerCase() === 'none') {
          continue;
        }
        if (/^\d{3,}$/.test(s)) {
          continue;
        }
        if (/^\d+$/.test(s)) {
          const num = parseInt(s, 10);
          if (num >= 1 && num <= 12) {
            validClasses.push(`Class ${num}`);
          }
          continue;
        }
        const m1 = s.match(/^(\d{1,2})-([A-Za-z]{3})$/);
        if (m1 && monthMap[m1[2].toLowerCase()]) {
          validClasses.push(`Class ${monthMap[m1[2].toLowerCase()]}-${m1[1]}`);
          continue;
        }
        const m2 = s.match(/^([A-Za-z]{3})-(\d{1,2})$/);
        if (m2 && monthMap[m2[1].toLowerCase()]) {
          validClasses.push(`Class ${monthMap[m2[1].toLowerCase()]}-${m2[2]}`);
          continue;
        }
        if (/\b\d{4,}\b/.test(s)) {
          continue;
        }
        validClasses.push(s);
      }

      return Array.from(new Set(validClasses));
    };

    const SUBJECTS_LIST = [

    const matchesCatalogFilter = (rawValue, selectedLabel, catalog) => {
      const val = String(rawValue || '').toLowerCase().trim();
      if (!val || val === 'not specified') return false;
      const entry = catalog.find((item) => item.label === selectedLabel);
      if (!entry) {
        return val.includes(selectedLabel.toLowerCase());
      }
      return entry.aliases.some((alias) => {
        if (alias.length <= 3) {
          const wordRegex = new RegExp(`(^|[^a-z])${alias.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^a-z]|$)`, 'i');
          return wordRegex.test(val);
        }
        return val.includes(alias);
      });
    };

      // Parse CSV Text into Array of Rows
      const parseCsvTextToMatrix = (csvText) => {
        const rows = [];
        let currentRow = [];
        let currentCell = '';
        let inQuotes = false;

        for (let i = 0; i < csvText.length; i++) {
          const ch = csvText[i];
          const nextCh = csvText[i + 1];

          if (ch === '"') {
            if (inQuotes && nextCh === '"') {
              currentCell += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            currentRow.push(currentCell.trim());
            currentCell = '';
          } else if ((ch === '\r' || ch === '\n') && !inQuotes) {
            if (ch === '\r' && nextCh === '\n') i++;
            currentRow.push(currentCell.trim());
            if (currentRow.some(c => c !== '')) rows.push(currentRow);
            currentRow = [];
            currentCell = '';
          } else {
            currentCell += ch;
          }
        }
        if (currentCell !== '' || currentRow.length > 0) {
          currentRow.push(currentCell.trim());
          if (currentRow.some(c => c !== '')) rows.push(currentRow);
        }
        return rows;
      };

      // Convert CSV Matrix to Tutor Objects
      const parseMatrixToTutors = useCallback((matrix) => {
        if (!matrix || matrix.length < 2) return [];
        const headers = matrix[0].map(h => String(h || '').toLowerCase().trim());

        const findCol = (predicates) => {
          for (const pred of predicates) {
            const idx = headers.findIndex(h => pred(h));
            if (idx !== -1) return idx;

          return -1;

        const nameIdx = findCol([
          h => h === 'full name' || h === 'name' || h === 'teacher name',

        const uniIdx = findCol([
          h => h.includes('university'),

        const mapByPhone = new Map();

        for (let r = 1; r < matrix.length; r++) {

          const subjectsVal = ensureArray(getCell(row, subjIdx));
          const classesVal = normalizeClassString(getCell(row, classIdx));
          const rawSalStr = getCell(row, salaryIdx).trim();
          const cleanSalRange =
            rawSalStr && rawSalStr.toLowerCase() !== 'nan' ? rawSalStr : 'Not Provided';

          const salaryBounds = parseSalaryRangeBounds(cleanSalRange, 0);

          const bioParts = [];
          if (cleanSalRange !== 'Not Provided') {
            bioParts.push(`[SALARY_RANGE:${cleanSalRange}]`);
          }
          const n1 = getCell(row, notesIdx);
          const n2 = getCell(row, banglaNoteIdx);
          if (n1 && n1.toLowerCase() !== 'yes' && n1.toLowerCase() !== 'nan') bioParts.push(n1);
          if (n2 && n2 !== n1 && n2.toLowerCase() !== 'nan') bioParts.push(n2);

          const cleanedName = cleanTutorName(rawName);

            id: Date.now() + r + Math.floor(Math.random() * 10000),
            name: cleanedName,
            gender: genderVal,
            phone: phoneFormatted.localWithZero,
            whatsapp: waFormatted.localWithZero || phoneFormatted.localWithZero,
            presentAddress: selfLocVal,
            university: uniVal,
            department: deptVal,
            preferredAreas: areasVal,
            subjects: subjectsVal,
            classes: classesVal,
            expectedSalary: salaryBounds.hasSalary ? salaryBounds.min : 0,
            salaryMin: salaryBounds.min,

              });

            .from(supabaseConfig.tableName)

            const p = formatBdPhoneNumbers(r.phone || '').localWithZero;

            if (!existing) {
              toInsert.push({
                name: st.name,
                phone: st.phone,
                presentAddress: st.presentAddress,
                university: st.university,
                department: st.department,
                preferredAreas: st.preferredAreas,
                subjects: st.subjects,
                classes: st.classes,
                expectedSalary: st.expectedSalary,
                bio: st.bio,
                avatar: st.avatar

            } else {
              const exNorm = normalizeTutorRow(existing);
              const cleanStBio = st.bio.replace(/\[SALARY_RANGE:[^\]]+\]\s*•?\s*/g, '').trim();
              const changed =
                exNorm.name !== st.name ||
                exNorm.university !== st.university ||
                exNorm.department !== st.department ||
                exNorm.presentAddress !== st.presentAddress ||
                exNorm.salaryRange !== st.salaryRange ||
                JSON.stringify(exNorm.classes) !== JSON.stringify(st.classes) ||
                JSON.stringify(exNorm.preferredAreas) !== JSON.stringify(st.preferredAreas) ||
                JSON.stringify(exNorm.subjects) !== JSON.stringify(st.subjects) ||
                exNorm.bio !== cleanStBio;

              if (changed) {
                toUpdate.push({
                  id: existing.id,
                  payload: {
                    name: st.name,
                    presentAddress: st.presentAddress,
                    university: st.university,
                    department: st.department,
                    preferredAreas: st.preferredAreas,
                    subjects: st.subjects,
                    classes: st.classes,
                    expectedSalary: st.expectedSalary,
                    bio: st.bio
                  }
                });
              }
            }

            await client.from(supabaseConfig.tableName).insert(toInsert);
          }

            await client.from(supabaseConfig.tableName).update(item.payload).eq('id', item.id);

              triggerToast(`Synced! New: ${toInsert.length}, Updated: ${toUpdate.length}`);
            }

      // Upload CSV File Handler
      const handleCsvFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        let allParsed = [];
        for (const file of files) {
          const text = await file.text();
          const matrix = parseCsvTextToMatrix(text);

          allParsed = [...allParsed, ...items];
        }

        if (allParsed.length === 0) {
          triggerToast('CSV ফাইলে কোনো বৈধ টিউটর পাওয়া যায়নি!');
          return;
        }

        const mergedMap = new Map();
        allParsed.forEach((t) => {
          if (mergedMap.has(t.phone)) {
            const prev = mergedMap.get(t.phone);
            mergedMap.set(t.phone, {
              ...prev,
              ...t,
              subjects: t.subjects.length > 0 ? t.subjects : prev.subjects,
              preferredAreas: t.preferredAreas.length > 0 ? t.preferredAreas : prev.preferredAreas,
              bio: t.bio || prev.bio
            });

      // Clean Standardized Dropdown Lists (No Unknown / Messy Sheet Garbage)
      const uniqueUniversities = useMemo(() => {

      const uniqueAreas = useMemo(() => {

      // Matched & Filtered Tutors Calculation (Uses appliedRequirements triggered by Search Now button)
      const matchedTutors = useMemo(() => {
        const activeFilter = appliedRequirements;
        const budgetCap = Number(activeFilter.salaryBudgetCap) || 25000;
        const isBudgetFilterActive = budgetCap < 25000;

        return tutors
          .filter((t) => {
            // 0. Top Search Bar Query
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase().trim();
              const hay = `${t.name} ${t.university} ${t.department} ${t.presentAddress} ${t.phone} ${(t.preferredAreas || []).join(' ')} ${(t.subjects || []).join(' ')} ${t.salaryRange || ''}`.toLowerCase();
              if (!hay.includes(q)) return false;
            }

            // 1. Class / Grade Smart Filter (Matches numeric grade ranges + text)
            if (activeFilter.selectedClass && activeFilter.selectedClass !== 'All Classes') {
              const targetGrades = parseClassNumbers(activeFilter.selectedClass);
              const tutorClassText = `${(t.classes || []).join(' ')} ${t.bio || ''}`;
              const tutorGrades = parseClassNumbers(tutorClassText);

              if (targetGrades.size > 0) {
                if (tutorGrades.size === 0) return false;
                const hasOverlap = Array.from(targetGrades).some((g) => tutorGrades.has(g));
                if (!hasOverlap) return false;
              } else {
                const cls = activeFilter.selectedClass.toLowerCase().replace('class ', '').trim();
                if (!tutorClassText.toLowerCase().includes(cls)) return false;
              }
            }

            // 2. Subject Names Filter
            if (activeFilter.selectedSubjects.length > 0) {
              const tSub = `${(t.subjects || []).join(' ')} ${t.department}`.toLowerCase();
              const hasAny = activeFilter.selectedSubjects.some((s) => {
                const cleanSub = s.toLowerCase().replace(/\(.*?\)/g, '').trim();
                return tSub.includes(cleanSub) || (cleanSub.includes('math') && tSub.includes('math'));
              });
              if (!hasAny) return false;
            }

            // 3. Preferred Gender Filter
            if (activeFilter.preferredGender && activeFilter.preferredGender !== 'Any') {
              const tGen = String(t.gender || '').toLowerCase();
              if (tGen && tGen !== 'any' && tGen !== activeFilter.preferredGender.toLowerCase()) {
                return false;
              }
            }

            // 4. Preferred University Filter (Smart Alias Matching)
            if (activeFilter.selectedUniversity && activeFilter.selectedUniversity !== 'All Universities') {
              if (!matchesCatalogFilter(t.university, activeFilter.selectedUniversity, UNIVERSITY_CATALOG)) {
                return false;
              }
            }

            // 5. Preferred Department Filter (Smart Alias Matching)
            if (activeFilter.selectedDepartment && activeFilter.selectedDepartment !== 'All Departments') {
              if (!matchesCatalogFilter(t.department, activeFilter.selectedDepartment, DEPARTMENT_CATALOG)) {
                return false;
              }
            }

            // 6. Tuition Area(s) Filter
            if (activeFilter.selectedAreas.length > 0) {
              const tArea = `${(t.preferredAreas || []).join(' ')} ${t.presentAddress}`.toLowerCase();
              const hasArea = activeFilter.selectedAreas.some((a) => {
                const keywords = a.toLowerCase().split(/\s+/).filter((w) => w.length >= 3);
                return tArea.includes(a.toLowerCase()) || keywords.some((kw) => tArea.includes(kw));
              });
              if (!hasArea) return false;
            }

            // 7. Salary Budget Cap Filter (Strictly checks parsed range bounds)
            if (isBudgetFilterActive) {
              const bounds = parseSalaryRangeBounds(t.salaryRange, t.expectedSalary);
              // When user actively lowers budget cap below 15000, exclude tutors without salary or above cap
              if (budgetCap < 15000) {
                if (!bounds.hasSalary) return false;
                if (bounds.min > budgetCap) return false;
              } else {
                // Between 15000 and 24500: exclude any tutor whose minimum salary exceeds budgetCap
                if (bounds.hasSalary && bounds.min > budgetCap) return false;
              }
            }

            return true;
          })
          .map((t) => {
            let score = 60;
            const bounds = parseSalaryRangeBounds(t.salaryRange, t.expectedSalary);
            if (activeFilter.selectedAreas.length > 0) score += 18;
            if (activeFilter.selectedSubjects.length > 0) score += 12;
            if (activeFilter.selectedUniversity !== 'All Universities') score += 5;
            if (bounds.hasSalary && bounds.max <= budgetCap) score += 4;
            return {
              ...t,
              salaryMin: bounds.min,
              salaryMax: bounds.max,
              hasSalary: bounds.hasSalary,
              matchScore: Math.min(99, score)
            };
          })
          .sort((a, b) => {
            // Prioritize tutors who have explicit salary within budget when budget filter is used
            if (isBudgetFilterActive && a.hasSalary !== b.hasSalary) {
              return a.hasSalary ? -1 : 1;
            }
            return b.matchScore - a.matchScore;

            `https://wa.me/${formatted.wasenderFormat}?text=${encodeURIComponent(messageText)}`,
            '_blank'

          triggerToast(`WaSender ফরম্যাটে (${formatted.wasenderFormat}) হোয়াটসঅ্যাপ ওপেন হয়েছে!`);
          return;

        setIsSendingGateway(true);

            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${wasenderConfig.apiKey}`

            body: JSON.stringify({
              to: formatted.wasenderFormat,
              phone: formatted.wasenderFormat,
              number: formatted.wasenderFormat,
              text: messageText,
              message: messageText,

              <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden">
                <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-base">
                      Send Message to {selectedTutorForSms.name}
                    </h3>
                    <p className="text-xs text-emerald-400 font-mono mt-0.5">
                      Local: {formatBdPhoneNumbers(selectedTutorForSms.phone).localWithZero} •
                      WaSender: {formatBdPhoneNumbers(selectedTutorForSms.phone).wasenderFormat}
                    </p>
                  </div>
                  <button
                    onClick={() => setSelectedTutorForSms(null)}
                    className="text-slate-400 hover:text-white"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-5 space-y-4 text-xs">
                  <textarea
                    rows={5}
                    value={smsText}
                    onChange={(e) => setSmsText(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none font-medium text-slate-800"
                  />

                  <div className="flex flex-wrap items-center justify-between gap-2 pt-2">
                    <button
                      onClick={() => {
                        copyToClipboardSafe(smsText);
                        triggerToast('মেসেজ কপি করা হয়েছে!');
                      }}
                      className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold flex items-center gap-1.5"
                    >
                      <Icon name="copy" size={14} />
                      <span>Copy</span>
                    </button>

                    <div className="flex items-center gap-2">
                      <button
                        disabled={isSendingGateway}
                        onClick={() =>
                          sendViaPhoneSmsGateway(selectedTutorForSms.phone, smsText)
                        }
                        className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold flex items-center gap-1.5"
                      >
                        <Icon name="phone" size={14} />
                        <span>Send Phone SMS</span>
                      </button>

                      <button
                        disabled={isSendingGateway}
                        onClick={() =>
                          sendViaWasenderGateway(selectedTutorForSms.phone, smsText)
                        }
                        className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold flex items-center gap-1.5 shadow-sm"
                      >
                        <Icon name="messageCircle" size={14} />
                        <span>Send via WaSender</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ==================================================================== */}
          {/* BULK MESSAGE MODAL                                                   */}
          {/* ==================================================================== */}
          {bulkSmsModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden">
                <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-base">
                      Bulk Dispatch ({selectedTutorIds.length} Tutors)
                    </h3>
                    <p className="text-xs text-emerald-400">
                      All numbers formatted automatically (+0 &amp; 880)
                    </p>
                  </div>
                  <button
                    onClick={() => setBulkSmsModalOpen(false)}
                    className="text-slate-400 hover:text-white"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-5 space-y-4 text-xs">
                  <textarea
                    rows={4}
                    value={bulkSmsText}
                    onChange={(e) => setBulkSmsText(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-medium"
                  />

                  <div className="flex justify-end gap-2">
                    <button
                      onClick={() => setBulkSmsModalOpen(false)}
                      className="px-4 py-2 rounded-xl font-bold text-slate-600"
                    >
                      Close
                    </button>
                    <button
                      onClick={async () => {
                        const targets = matchedTutors.filter((t) =>
                          selectedTutorIds.includes(t.id)
                        );
                        for (const t of targets) {
                          await sendViaWasenderGateway(t.phone, bulkSmsText);
                        }
                        setBulkSmsModalOpen(false);
                      }}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold flex items-center gap-1.5"
                    >
                      <Icon name="send" size={14} />
                      <span>Send All via WaSender</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ==================================================================== */}
          {/* ADD NEW TUTOR MODAL                                                  */}
          {/* ==================================================================== */}
          {addTutorModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full max-h-[90vh] shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
                <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                  <h3 className="font-bold text-base">Add New Tutor</h3>
                  <button
                    onClick={() => setAddTutorModalOpen(false)}
                    className="text-slate-400 hover:text-white"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-5 overflow-y-auto space-y-3 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        1. Teacher name *
                      </label>
                      <input
                        type="text"
                        value={newTutorForm.name}
                        onChange={(e) =>
                          setNewTutorForm({ ...newTutorForm, name: e.target.value })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="e.g. Mizanur Rahman"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        2. Contacts (Phone) *
                      </label>
                      <input
                        type="text"
                        value={newTutorForm.phone}
                        onChange={(e) =>
                          setNewTutorForm({ ...newTutorForm, phone: e.target.value })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="017XXXXXXXX"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        3. Present Location
                      </label>
                      <input
                        type="text"
                        value={newTutorForm.presentAddress}
                        onChange={(e) =>
                          setNewTutorForm({ ...newTutorForm, presentAddress: e.target.value })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="e.g. Dhanmondi"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        4. University name
                      </label>
                      <input
                        type="text"
                        value={newTutorForm.university}
                        onChange={(e) =>
                          setNewTutorForm({ ...newTutorForm, university: e.target.value })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="e.g. University of Dhaka"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">5. Department</label>
                      <input
                        type="text"
                        value={newTutorForm.department}
                        onChange={(e) =>
                          setNewTutorForm({ ...newTutorForm, department: e.target.value })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="e.g. CSE / Physics"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        6. Kon kon area te tuitioni korabe
                      </label>
                      <input
                        type="text"
                        value={newTutorForm.preferredAreas.join(', ')}
                        onChange={(e) =>
                          setNewTutorForm({
                            ...newTutorForm,
                            preferredAreas: ensureArray(e.target.value)
                          })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="Dhanmondi, Azimpur..."
                      />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="block font-bold text-slate-700 mb-1">
                        7. Your Favourite Subject
                      </label>
                      <input
                        type="text"
                        value={newTutorForm.subjects.join(', ')}
                        onChange={(e) =>
                          setNewTutorForm({
                            ...newTutorForm,
                            subjects: ensureArray(e.target.value)
                          })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="Math, Physics, English..."
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        8. Class Level
                      </label>
                      <input
                        type="text"
                        value={ensureArray(newTutorForm.classes).join(', ')}
                        onChange={(e) =>
                          setNewTutorForm({
                            ...newTutorForm,
                            classes: ensureArray(e.target.value)
                          })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="e.g. 5-10, 10-12 (SSC & HSC)"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">
                        9. Salary Range
                      </label>
                      <input
                        type="text"
                        value={newTutorForm.salaryRange}
                        onChange={(e) =>
                          setNewTutorForm({ ...newTutorForm, salaryRange: e.target.value })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="e.g. 4-7,000"
                      />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="block font-bold text-slate-700 mb-1">
                        10. Bio / Note (কিছু থাকলে লিখুন, না থাকলে খালি রাখুন)
                      </label>
                      <input
                        type="text"
                        value={newTutorForm.bio}
                        onChange={(e) =>
                          setNewTutorForm({ ...newTutorForm, bio: e.target.value })
                        }
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                        placeholder="I am an experienced tutor..."
                      />
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                  <button
                    onClick={() => setAddTutorModalOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleManualAddTutor}
                    className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold"
                  >
                    Save Tutor
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==================================================================== */}
          {/* ADD MANUAL REQUEST MODAL                                             */}
          {/* ==================================================================== */}
          {addRequestModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
                <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                  <h3 className="font-bold text-base">Add Manual Guardian Request</h3>
                  <button
                    onClick={() => setAddRequestModalOpen(false)}
                    className="text-slate-400 hover:text-white"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-5 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tuition Code</label>
                    <input
                      type="text"
                      value={newRequestForm.code}
                      onChange={(e) =>
                        setNewRequestForm({ ...newRequestForm, code: e.target.value })
                      }
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Student Name *</label>
                    <input
                      type="text"
                      value={newRequestForm.studentName}
                      onChange={(e) =>
                        setNewRequestForm({ ...newRequestForm, studentName: e.target.value })
                      }
                      placeholder="e.g. Rakib"
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Guardian Name</label>
                    <input
                      type="text"
                      value={newRequestForm.guardianName}
                      onChange={(e) =>
                        setNewRequestForm({ ...newRequestForm, guardianName: e.target.value })
                      }
                      placeholder="e.g. Mr. Hasan"
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Class</label>
                    <input
                      type="text"
                      value={newRequestForm.className}
                      onChange={(e) =>
                        setNewRequestForm({ ...newRequestForm, className: e.target.value })
                      }
                      placeholder="Class 9"
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Location</label>
                    <input
                      type="text"
                      value={newRequestForm.location}
                      onChange={(e) =>
                        setNewRequestForm({ ...newRequestForm, location: e.target.value })
                      }
                      placeholder="Dhanmondi (General)"
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Guardian Contact</label>
                    <input
                      type="text"
                      value={newRequestForm.contact}
                      onChange={(e) =>
                        setNewRequestForm({ ...newRequestForm, contact: e.target.value })
                      }
                      placeholder="017XXXXXXXX"
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                </div>

                <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                  <button
                    onClick={() => setAddRequestModalOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleAddManualRequest}
                    className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold"
                  >
                    Save Request
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ==================================================================== */}
          {/* ADD PAYMENT RECORD MODAL                                             */}
          {/* ==================================================================== */}
          {addPaymentModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
                <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                  <h3 className="font-bold text-base">Add Payment Ledger Record</h3>
                  <button
                    onClick={() => setAddPaymentModalOpen(false)}
                    className="text-slate-400 hover:text-white"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-5 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tuition Code</label>
                    <input
                      type="text"
                      value={newPaymentForm.tuitionCode}
                      onChange={(e) =>
                        setNewPaymentForm({ ...newPaymentForm, tuitionCode: e.target.value })
                      }
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tutor Name *</label>
                    <input
                      type="text"
                      value={newPaymentForm.tutorName}
                      onChange={(e) =>
                        setNewPaymentForm({ ...newPaymentForm, tutorName: e.target.value })
                      }
                      placeholder="e.g. Mizanur Rahman"
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Tutor Phone</label>
                    <input
                      type="text"
                      value={newPaymentForm.tutorPhone}
                      onChange={(e) =>
                        setNewPaymentForm({ ...newPaymentForm, tutorPhone: e.target.value })
                      }
                      placeholder="017XXXXXXXX"
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Student Name</label>
                    <input
                      type="text"
                      value={newPaymentForm.studentName}
                      onChange={(e) =>
                        setNewPaymentForm({ ...newPaymentForm, studentName: e.target.value })
                      }
                      placeholder="e.g. Rakib"
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Monthly Fee (BDT)</label>
                    <input
                      type="number"
                      value={newPaymentForm.monthlyFee}
                      onChange={(e) =>
                        setNewPaymentForm({ ...newPaymentForm, monthlyFee: e.target.value })
                      }
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Paid Amount (BDT)</label>
                    <input
                      type="number"
                      value={newPaymentForm.paidAmount}
                      onChange={(e) =>
                        setNewPaymentForm({ ...newPaymentForm, paidAmount: e.target.value })
                      }
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl"
                    />
                  </div>
                </div>

                <div className="p-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-2">
                  <button
                    onClick={() => setAddPaymentModalOpen(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleAddPaymentRecord}
                    className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold"
                  >
                    Save Record
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
